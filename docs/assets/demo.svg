<rect width="884" height="926" rx="12" fill="#14161c"/>
<rect width="884" height="38" rx="12" fill="#1d2029"/>
<rect y="26" width="884" height="12" fill="#1d2029"/>
<circle cx="24" cy="19" r="6" fill="#ff5f57"/><circle cx="44" cy="19" r="6" fill="#febc2e"/><circle cx="64" cy="19" r="6" fill="#28c840"/>
<text x="442" y="24" text-anchor="middle" style="fill:#7d8498;font-size:12.5px">examples/demo-app</text>
<text class="l0" x="22" y="68" xml:space="preserve"><tspan class="green">$</tspan> shakeout -- node checks.js</text>
<text class="l1" x="22" y="87" xml:space="preserve"></text>
<text class="l2" x="22" y="106" xml:space="preserve"><tspan class="b">shakeout</tspan> <tspan class="dim">·</tspan> node checks.js <tspan class="dim">·</tspan> 9 perturbations <tspan class="dim">·</tspan> baseline ok <tspan class="dim">(0.1s)</tspan></text>
<text class="l3" x="22" y="125" xml:space="preserve"></text>
<text class="l4" x="22" y="144" xml:space="preserve">  <tspan class="green">✔</tspan> tz-utc         <tspan class="dim">same</tspan></text>
<text class="l5" x="22" y="163" xml:space="preserve">  <tspan class="red">✘</tspan> tz-los-angeles <tspan class="red">exit 1</tspan> <tspan class="dim">3/3 reproduced</tspan></text>
<text class="l6" x="22" y="182" xml:space="preserve">  <tspan class="red">✘</tspan> tz-kiritimati  <tspan class="red">exit 1</tspan> <tspan class="dim">3/3 reproduced</tspan></text>
<text class="l7" x="22" y="201" xml:space="preserve">  <tspan class="red">✘</tspan> locale-german  <tspan class="red">exit 1</tspan> <tspan class="dim">3/3 reproduced</tspan></text>
<text class="l8" x="22" y="220" xml:space="preserve">  <tspan class="red">✘</tspan> home-empty     <tspan class="red">exit 1</tspan> <tspan class="dim">3/3 reproduced</tspan></text>
<text class="l9" x="22" y="239" xml:space="preserve">  <tspan class="green">✔</tspan> path-spaces    <tspan class="dim">same</tspan></text>
<text class="l10" x="22" y="258" xml:space="preserve">  <tspan class="red">✘</tspan> tmpdir-spaces  <tspan class="red">exit 1</tspan> <tspan class="dim">3/3 reproduced</tspan></text>
<text class="l11" x="22" y="277" xml:space="preserve">  <tspan class="green">✔</tspan> ci-on          <tspan class="dim">same</tspan></text>
<text class="l12" x="22" y="296" xml:space="preserve">  <tspan class="green">✔</tspan> umask-077      <tspan class="dim">same</tspan></text>
<text class="l13" x="22" y="315" xml:space="preserve"></text>
<text class="l14" x="22" y="334" xml:space="preserve"><tspan class="b">5 environment assumptions found</tspan></text>
<text class="l15" x="22" y="353" xml:space="preserve"></text>
<text class="l16" x="22" y="372" xml:space="preserve"><tspan class="red">✘</tspan> <tspan class="b">tz-los-angeles</tspan> <tspan class="dim">[tz]</tspan>  TZ=America/Los_Angeles (UTC-8/-7, observes DST)</text>
<text class="l17" x="22" y="391" xml:space="preserve">    <tspan class="cyan">│</tspan> FAIL invoice dated 2024-03-10 is on the 10th</text>
<text class="l18" x="22" y="410" xml:space="preserve">    <tspan class="cyan">│</tspan> expected 10, got 9</text>
<text class="l19" x="22" y="429" xml:space="preserve">    <tspan class="dim">→</tspan> A date-only string like "2024-03-10" is parsed as UTC but read back in local time, which lands</text>
<text class="l20" x="22" y="448" xml:space="preserve">      on the previous day west of Greenwich.</text>
<text class="l21" x="22" y="467" xml:space="preserve">    <tspan class="dim">$</tspan> env TZ=America/Los_Angeles node checks.js</text>
<text class="l22" x="22" y="486" xml:space="preserve"></text>
<text class="l23" x="22" y="505" xml:space="preserve"><tspan class="red">✘</tspan> <tspan class="b">tz-kiritimati</tspan> <tspan class="dim">[tz]</tspan>  TZ=Pacific/Kiritimati (UTC+14, the furthest east)</text>
<text class="l24" x="22" y="524" xml:space="preserve">    <tspan class="cyan">│</tspan> FAIL noon job on 2024-06-01 is scheduled for 2024-06-01</text>
<text class="l25" x="22" y="543" xml:space="preserve">    <tspan class="cyan">│</tspan> expected "2024-06-01", got "2024-05-31"</text>
<text class="l26" x="22" y="562" xml:space="preserve">    <tspan class="dim">→</tspan> Local time is more than 12h ahead of UTC, so "local noon" is still yesterday in UTC.</text>
<text class="l27" x="22" y="581" xml:space="preserve">    <tspan class="dim">$</tspan> env TZ=Pacific/Kiritimati node checks.js</text>
<text class="l28" x="22" y="600" xml:space="preserve"></text>
<text class="l29" x="22" y="619" xml:space="preserve"><tspan class="red">✘</tspan> <tspan class="b">locale-german</tspan> <tspan class="dim">[locale]</tspan>  LC_ALL=de_DE.UTF-8: 1.234,5 instead of 1,234.5</text>
<text class="l30" x="22" y="638" xml:space="preserve">    <tspan class="cyan">│</tspan> FAIL total 1234567.5 renders as 1,234,567.5</text>
<text class="l31" x="22" y="657" xml:space="preserve">    <tspan class="cyan">│</tspan> expected "1,234,567.5", got "1.234.567,5"</text>
<text class="l32" x="22" y="676" xml:space="preserve">    <tspan class="dim">→</tspan> Number or date formatting uses the ambient locale and the result is compared or parsed as if</text>
<text class="l33" x="22" y="695" xml:space="preserve">      it were en-US.</text>
<text class="l34" x="22" y="714" xml:space="preserve">    <tspan class="dim">$</tspan> env LC_ALL=de_DE.UTF-8 LANG=de_DE.UTF-8 node checks.js</text>
<text class="l35" x="22" y="733" xml:space="preserve"></text>
<text class="l36" x="22" y="752" xml:space="preserve"><tspan class="red">✘</tspan> <tspan class="b">home-empty</tspan> <tspan class="dim">[home]</tspan>  HOME points at a brand-new empty directory</text>
<text class="l37" x="22" y="771" xml:space="preserve">    <tspan class="cyan">│</tspan> FAIL font cache directory ~/.cache can be listed</text>
<text class="l38" x="22" y="790" xml:space="preserve">    <tspan class="cyan">│</tspan> ENOENT: no such file or directory, scandir '&lt;PATH&gt;/home-empty/.cache'</text>
<text class="l39" x="22" y="809" xml:space="preserve">    <tspan class="dim">→</tspan> Code assumes ~/.config, ~/.cache or a dotfile already exists. A fresh CI user or container has</text>
<text class="l40" x="22" y="828" xml:space="preserve">      none of them.</text>
<text class="l41" x="22" y="847" xml:space="preserve"></text>
<text class="l42" x="22" y="866" xml:space="preserve"></text>
<text class="l43" x="22" y="885" xml:space="preserve"><tspan class="dim">  ... 7 more lines</tspan></text>
